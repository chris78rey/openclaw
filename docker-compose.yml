version: "3.8"

services:
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    image: datica-rag-web:latest
    restart: unless-stopped
    init: true
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2:3b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      RAG_TOP_K: ${RAG_TOP_K:-6}
    expose:
      - "8080"
    networks:
      - app_net
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${DOCKER_NETWORK:-coolify}
      - "traefik.http.routers.${APP_ID:-datica-rag}-web.rule=Host(`${PUBLIC_WEB_HOST:-bot.da-tica.com}`)"
      - "traefik.http.routers.${APP_ID:-datica-rag}-web.entrypoints=https"
      - "traefik.http.routers.${APP_ID:-datica-rag}-web.tls=true"
      - "traefik.http.routers.${APP_ID:-datica-rag}-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.${APP_ID:-datica-rag}-web.loadbalancer.server.port=8080"
      - "traefik.http.routers.${APP_ID:-datica-rag}-web-http.rule=Host(`${PUBLIC_WEB_HOST:-bot.da-tica.com}`)"
      - "traefik.http.routers.${APP_ID:-datica-rag}-web-http.entrypoints=http"
      - "traefik.http.routers.${APP_ID:-datica-rag}-web-http.middlewares=${APP_ID:-datica-rag}-redirect"
      - "traefik.http.middlewares.${APP_ID:-datica-rag}-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${APP_ID:-datica-rag}-redirect.redirectscheme.permanent=true"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    networks:
      - app_net

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    networks:
      - app_net
    entrypoint: >
      sh -c "
        ollama serve &
        OLLAMA_PID=$$!
        echo '[init] Esperando que Ollama arranque...'
        for i in $$(seq 1 30); do
          ollama list >/dev/null 2>&1 && break
          sleep 2
        done
        echo '[init] Descargando modelos (skip si ya existen)...'
        ollama pull ${CHAT_MODEL:-llama3.2:3b}
        ollama pull ${EMBED_MODEL:-bge-m3}
        echo '[init] Modelos listos'
        wait $$OLLAMA_PID
      "
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q '${CHAT_MODEL:-llama3.2:3b}' && ollama list | grep -q '${EMBED_MODEL:-bge-m3}'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEM_LIMIT:-8G}

volumes:
  qdrant_data:
  ollama_data:

networks:
  app_net:
    name: ${DOCKER_NETWORK:-coolify}
    external: true
