services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${OPENCLAW_IMAGE:-openclaw-runtime:latest}
    container_name: openclaw
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-openrouter/minimax/minimax-m2.5}
    volumes:
      - openclaw_data:/root/.openclaw
    expose:
      - "18789"
    command:
      - bash
      - -lc
      - |
        set -e
        test -n "${OPENCLAW_GATEWAY_TOKEN}"
        test -n "${TELEGRAM_BOT_TOKEN}"
        test -n "${OPENROUTER_API_KEY}"
        openclaw config set gateway.mode local
        openclaw config set gateway.auth.token "${OPENCLAW_GATEWAY_TOKEN}"
        openclaw config set gateway.remote.token "${OPENCLAW_GATEWAY_TOKEN}"
        openclaw config set models.mode merge
        openclaw config set models.providers.openrouter.apiKey "${OPENROUTER_API_KEY}"
        openclaw config set agents.defaults.model.primary "${MINIMAX_MODEL}"
        openclaw config set agents.defaults.model.fallbacks "[]" --json
        openclaw config set channels.telegram.enabled true
        openclaw config set channels.telegram.botToken "${TELEGRAM_BOT_TOKEN}"
        openclaw config set channels.telegram.dmPolicy open
        openclaw config set channels.telegram.allowFrom '["*"]' --json
        openclaw config set gateway.controlUi.allowedOrigins '["https://bot.da-tica.com","http://localhost:18789"]'
        openclaw config set gateway.controlUi.dangerouslyAllowHostHeaderOriginFallback false
        openclaw doctor --fix || true
        exec openclaw gateway --bind lan --port 18789 --allow-unconfigured
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.openclaw.rule=Host(`bot.da-tica.com`)
      - traefik.http.routers.openclaw.entrypoints=https
      - traefik.http.routers.openclaw.tls=true
      - traefik.http.routers.openclaw.tls.certresolver=letsencrypt
      - traefik.http.services.openclaw.loadbalancer.server.port=18789
volumes:
  openclaw_data:
networks:
  coolify:
    external: true
